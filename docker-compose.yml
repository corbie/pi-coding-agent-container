services:
  pi-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: local/pi-coding-agent:latest
    container_name: pi_coding_agent
    
    tty: true
    stdin_open: true

    environment:
      - EDITOR=vim

    volumes:
      - workspace:/workspace
      - pi_data:/home/node/.pi
      
    user: "${UID:-1001}:${GID:-1001}"
    
    # Use local host port for Google OAuth redirect service
    network_mode: "host"
    ports:
      - "8085:8085"

    restart: "no"

volumes:
  pi_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/.pi

  workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PI_AGENT_WORKSPACE:-${PWD}/workspace}
